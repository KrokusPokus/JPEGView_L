name: Build Portable JPEGView

on:
  push:
    branches:
      - master
      - azizr12-patch-3
  pull_request:
    branches:
      - master
      - azizr12-patch-3
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build-portable:
    name: Build Portable ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only building the 64-bit version
          - platform: x64
            arch: x64
            config: Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Do NOT use "submodules: recursive" here: the prebuilt dependency
          # libraries are committed to the repo, and pulling every source
          # submodule (libjxl, libheif, dav1d, ...) is slow and can fail.
          # Only WTL is needed, and it is initialized in the next step.
          submodules: false
          fetch-depth: 0

      - name: Checkout WTL submodule
        shell: cmd
        run: git submodule update --init deps/WTL-sf

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: ${{ matrix.arch }}

      - name: Build Main Application and Dependencies
        shell: cmd
        # JPEGView.vcxproj uses PlatformToolset v143, but WICLoader.vcxproj
        # still says v142 (VS2019). windows-2022 only ships v143, so force the
        # toolset for every project instead of failing on the missing v142.
        run: |
          msbuild.exe src\JPEGView.sln ^
            /target:JPEGView;WICLoader ^
            /p:Platform=${{ matrix.platform }} ^
            /p:Configuration=${{ matrix.config }} ^
            /p:PlatformToolset=v143 ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /m ^
            /verbosity:minimal

      - name: List build output
        shell: cmd
        run: dir /s /b src\JPEGView\bin\x64\${{ matrix.config }}

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JPEGView-Portable-${{ matrix.platform }}
          path: |
            src/JPEGView/bin/**/${{ matrix.config }}/*.exe
            src/JPEGView/bin/**/${{ matrix.config }}/*.dll
            src/JPEGView/bin/**/${{ matrix.config }}/*.pdb
            src/JPEGView/bin/**/${{ matrix.config }}/*.txt
          if-no-files-found: error
          retention-days: 14
